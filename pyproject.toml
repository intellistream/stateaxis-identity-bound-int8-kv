[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "stateaxis-identity-bound-int8-kv"
version = "0.2.0"
description = "Identity-bound INT8 KV eligibility and byte-accounting audit for StateAxis"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.12", "vllm-hust-ext>=0.3,<0.4"]

[project.entry-points."vllm_hust.extension_bundles"]
"org.vllm-hust.stateaxis-identity-bound-int8-kv" = "stateaxis_identity_bound_int8_kv"

[project.entry-points."stateaxis.mod_handlers"]
identity_bound_int8_kv = "stateaxis_identity_bound_int8_kv:identity_bound_int8_kv"

[tool.hatch.build.targets.wheel]
packages = ["src/stateaxis_identity_bound_int8_kv"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
